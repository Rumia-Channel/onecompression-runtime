[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onecomp-runtime"
version = "0.1.0"
description = "Shared int4 inference runtime (fused Triton / GemLite / eager) for OneCompression GPTQ-packed checkpoints."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "triton>=3.0; platform_system != 'Windows'",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# GemLite int4 GEMM backend (fp16 I/O; fastest at large M).
gemlite = ["gemlite>=0.5"]
# Generic diffusion loader rebuilds diffusers transformer classes.
diffusion = ["diffusers>=0.37", "huggingface-hub>=0.24"]
# XPU installs must use the PyTorch XPU wheel index, e.g.:
# pip install -e .[xpu] --index-url https://download.pytorch.org/whl/xpu --extra-index-url https://pypi.org/simple
xpu = [
    "torch>=2.5",
    "pytorch-triton-xpu>=3.3",
]

[tool.setuptools.packages.find]
include = ["onecomp_runtime*"]
