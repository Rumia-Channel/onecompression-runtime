[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onecomp-runtime"
version = "0.1.0"
description = "Shared int4 inference runtime (fused Triton / GemLite / eager) for OneCompression GPTQ-packed checkpoints."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "triton>=3.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# GemLite int4 GEMM backend (fp16 I/O; fastest at large M).
gemlite = ["gemlite>=0.5"]
# Generic diffusion loader rebuilds diffusers transformer classes.
diffusion = ["diffusers>=0.37", "huggingface-hub>=0.24"]

[tool.setuptools.packages.find]
include = ["onecomp_runtime*"]
